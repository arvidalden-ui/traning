<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Träning">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Träning</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>Träning</h1>
    <p id="date" class="muted"></p>
  </header>

  <p id="error" role="alert" hidden></p>

  <section aria-labelledby="trained-title">
    <h2 id="trained-title">Tränat idag</h2>
    <p class="muted">Tryck på en muskelgrupp för att markera. Tryck igen för att ångra.</p>
    <div id="groups" class="groups"></div>
    <p id="feedback" class="visually-hidden" role="status"></p>
  </section>

  <section aria-labelledby="recovery-title">
    <h2 id="recovery-title">Återhämtning</h2>
    <p class="muted">Uppskattning utifrån senaste träningsdag.</p>
    <ul id="recovery"></ul>
  </section>

  <footer>
    <details>
      <summary>Säkerhetskopia</summary>
      <div class="backup">
        <button id="export" type="button" disabled>Spara säkerhetskopia</button>
        <label for="import">Läs in säkerhetskopia</label>
        <input id="import" type="file" accept=".json,application/json" disabled>
        <p class="muted" id="backup-status" role="status"></p>
      </div>
    </details>
    <small id="version" class="muted"></small>
  </footer>
</main>
</body>
</html>
